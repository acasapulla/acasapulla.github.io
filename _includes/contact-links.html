<ul class="contact-links">
  {% if site.linkedin %}<li><a href="{{ site.linkedin }}" rel="me">LinkedIn</a></li>{% endif %}
  {% if site.github %}<li><a href="{{ site.github }}" rel="me">GitHub</a></li>{% endif %}
  {% if site.resume %}<li><a href="{{ site.resume | relative_url }}">Résumé (PDF)</a></li>{% endif %}
  {% if site.email %}<li><a href="mailto:{{ site.email }}">Email</a></li>{% endif %}
</ul>
